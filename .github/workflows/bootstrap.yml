name: Bootstrap ChangeGuard repository

on:
  workflow_dispatch:
  push:
    paths:
      - '_bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  import-project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project archive
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/part_* > /tmp/changeguard.tar.gz.b64
          base64 --decode /tmp/changeguard.tar.gz.b64 > /tmp/changeguard.tar.gz
          tar -xzf /tmp/changeguard.tar.gz -C .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import ChangeGuard full project"
          git push
